name: rebuild

# Tests an upstream release built with a current Go toolchain and patched
# modules, then publishes it as a signed distroless image. The branch names
# the release: patched-v26.2.0 publishes ghcr.io/<owner>/hydra:v26.2.0.
on:
  push:
    branches: ["patched-v*"]
  pull_request:
    branches: ["patched-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Upstream's own test job (ci.yaml at the release tag), on the toolchain
  # the image is built with.
  test:
    name: upstream test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
    env:
      TEST_DATABASE_POSTGRESQL: "postgres://postgres:secret@localhost:5432/postgres?sslmode=disable"
      TEST_DATABASE_MYSQL: "mysql://root:secret@(localhost:3306)/mysql?multiStatements=true&parseTime=true"
      TEST_DATABASE_COCKROACHDB: "cockroach://root@localhost:26257/defaultdb?sslmode=disable"
    steps:
      - name: Start CockroachDB
        run: |
          docker create --name cockroach -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.4 start-single-node --insecure
          docker start cockroach
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go version of the image build
        id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\)@.*/\1/p' .docker/Dockerfile-rebuild)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Run go tests
        run: go test -failfast -timeout=20m -tags sqlite,sqlite_omit_load_extension ./...

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign signs keyless, as this workflow.
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release version from the branch name
        id: meta
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          version=${BRANCH#patched-}
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$BRANCH is not patched-vX.Y.Z"; exit 1; }
          {
            echo "version=$version"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - name: Build for this runner and smoke-test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          docker build -f .docker/Dockerfile-rebuild -t hydra:smoke \
            --build-arg "VERSION=$VERSION" --build-arg "COMMIT=$GITHUB_SHA" --build-arg "DATE=$DATE" .
          .github/smoke-test.sh hydra:smoke "$VERSION"
      - name: Build, push and sign
        if: github.event_name != 'pull_request'
        uses: meysam81/build-docker@e1a24e3e00108b76f3d174ed4b723881f97c1b91 # v1.7.0
        with:
          checkout: "false"
          dockerfile: .docker/Dockerfile-rebuild
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cosign: true
          # SBOM and SLSA provenance ride in the pushed index as attestations.
          sbom: "true"
          provenance: mode=max
          image-name: ghcr.io/${{ github.repository }}
          # The release tag moves with every rebuild (pin it by digest); the
          # sha tag stays on the commit it was built from.
          metadata-tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=sha
          platforms: linux/amd64,linux/arm64
